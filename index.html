if(t.dataset.j){var gj=+t.dataset.j,vj=t.dataset.v,L=BJG[gj];if(cur.bj.indexOf(vj)>=0)cur.bj=cur.bj.filter(function(x){return x!==vj});else cur.bj=cur.bj.filter(function(x){return L.indexOf(x)<0}).concat([vj]);mr();return}
if(t.dataset.b){var bi=cur.bt.indexOf(t.dataset.b);if(bi>=0)cur.bt.splice(bi,1);else if(cur.bt.length>=3){note='별장치 특수 능력치는 최대 3개까지 선택할 수 있습니다.';mr();return}else cur.bt.push(t.dataset.b);mr();return}
if(t.dataset.h){if(cur.hs[t.dataset.h]===t.dataset.v)delete cur.hs[t.dataset.h];else cur.hs[t.dataset.h]=t.dataset.v;mr();return}
if(t.dataset.o){var ob=cur[t.dataset.o];if(ob[t.dataset.g]===t.dataset.v)delete ob[t.dataset.g];else ob[t.dataset.g]=t.dataset.v;mr();return}
if(t.dataset.k==='bb'){var v0=t.dataset.v;cur.bb=cur.bb[0]===v0?[]:[v0];if(!cur.bb.length){cur.bo='';cur.bs=''}mr();return}
if(t.dataset.k){var a=cur[t.dataset.k],v=t.dataset.v,i=a.indexOf(v);if(i<0){var lm=limMsg(t.dataset.k,v);if(lm){note=lm;mr();return}a.push(v)}else a.splice(i,1);mr();return}
if(t.id==='pf'){var g=gof(cur.name.trim());if(!g){note='목록에 있는 장수 이름을 입력하세요.'}else{var hh=g.ho.split(' ');cur.ho=hh.filter(function(x){return OPT.ho.indexOf(x)>=0});cur.mj=g.mj.split(' ').concat(hh).filter(function(x,i,a){return OPT.mj.indexOf(x)>=0&&a.indexOf(x)===i});cur.bi=(g.bi[0][1]+' '+g.bi[0][2]).split(' ').map(function(x){return {'문희':'채문희','상향':'손상향'}[x]||x});cur.gk=g.gk.split(' ');cur.bb=g.bb.split(' ').slice(0,1);trimSel();cur.bo={};cur.bs={};note=g.n+' 추천 세팅을 불러왔습니다. 내 캐릭터에 맞게 고쳐서 저장하세요.'}mr();return}
if(t.id==='nw'){cur=blank();mr();return}
if(t.id==='sv'){svc();return}
if(t.dataset.a==='load'){var f1=saved.filter(function(x){return x.id===t.dataset.id})[0];if(f1){cur={id:f1.id,name:f1.name,nick:f1.nick,ho:f1.ho.slice(),mj:f1.mj.slice(),bi:f1.bi.slice(),gk:f1.gk.slice(),bb:f1.bb.slice(0,1),bo:(f1.bo&&typeof f1.bo==='object')?Object.assign({},f1.bo):{},bs:(f1.bs&&typeof f1.bs==='object')?Object.assign({},f1.bs):{},hs:(f1.hs&&typeof f1.hs==='object')?Object.assign({},f1.hs):{},bj:Array.isArray(f1.bj)?f1.bj.slice(0,4):[],bm:typeof f1.bm==='string'?f1.bm:'',bt:Array.isArray(f1.bt)?f1.bt.slice(0,3):[],memo:'',pw:''};note='불러왔습니다. 수정하려면 비밀번호를 입력하고 "수정 저장"을 누르세요.';mr()}return}
if(t.dataset.a==='del'){dlc(t.dataset.id)}});
async function svc(){
  if(!DB){note='공유 저장소에 연결되지 않아 저장할 수 없습니다.';mr();return}
  if(!cur.name.trim()){note='장수 이름을 입력하세요.';mr();return}
  if(cur.ho.length+cur.mj.length>6||!bok(cur.bi,cur.gk)){note='선택 개수가 한도를 넘었습니다. 호부 6개, 비책 14개(+극품 수만큼 무쌍) 이내로 줄여 주세요.';mr();return}
  if((cur.pw||'').length<4){note='비밀번호를 4자 이상 입력하세요.';mr();return}
  try{
    var body={name:cur.name.trim(),nick:cur.nick,ho:cur.ho,mj:cur.mj,bi:cur.bi,gk:cur.gk,bb:cur.bb.slice(0,1),bo:cur.bb.length?cur.bo:{},bs:cur.bb.length?cur.bs:{},hs:cur.hs||{},bj:(cur.bj||[]).slice(0,4),bm:(cur.bm||'').slice(0,500),bt:(cur.bt||[]).slice(0,3),ts:Date.now()};
    var old=cur.id?saved.filter(function(x){return x.id===cur.id})[0]:null;
    if(old){
      if(await hsh(cur.pw,old.salt)!==old.ph){note='비밀번호가 일치하지 않아 수정할 수 없습니다.';mr();return}
      body.salt=old.salt;body.ph=old.ph;await DB.doc('chars/'+old.id).set(body);note='수정했습니다.'
    }else{
      if(saved.length>=100){note='등록은 최대 100개까지 가능합니다. 기존 캐릭터를 삭제한 뒤 등록하세요.';mr();return}
      var salt=Math.random().toString(36).slice(2)+Date.now().toString(36);body.salt=salt;body.ph=await hsh(cur.pw,salt);
      var r=await DB.collection('chars').add(body);cur.id=r.id;note='등록했습니다. 이 캐릭터를 수정·삭제하려면 같은 비밀번호가 필요합니다.'
    }
    cur.pw=''
  }catch(e){note='저장하지 못했습니다. ('+((e&&e.code)||'오류')+') 쓰기 권한이 없으면 등록할 수 없습니다.'}
  mr()}
async function dlc(id){
  var c=saved.filter(function(x){return x.id===id})[0];if(!c)return;
  var inp=document.querySelector('input[data-pwid="'+id.replace(/"/g,'')+'"]'),pw=inp?inp.value:'';
  if(!pw){setL('삭제하려면 해당 캐릭터의 비밀번호를 입력하세요.');return}
  try{
    if(await hsh(pw,c.salt)!==c.ph){setL('비밀번호가 일치하지 않아 삭제할 수 없습니다.');return}
    await DB.doc('chars/'+id).delete();if(cur.id===id)cur=blank();setL('삭제했습니다.')
  }catch(e){setL('삭제하지 못했습니다.')}}
show(0);
</script>
